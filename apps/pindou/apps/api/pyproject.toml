[project]
name = "pindou-api"
version = "0.1.0"
description = "Image-to-bead-grid API"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.fastapi]
entrypoint = "pindou.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pindou"]
