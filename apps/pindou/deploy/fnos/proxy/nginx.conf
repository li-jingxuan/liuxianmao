user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
# Nginx runtime errors can include the full request (and its query key).
# Keep those out of persistent logs; configuration/startup failures still exit.
error_log /dev/null;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # $uri omits the query string: delivery URLs may carry an API key.
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 32m;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Required private bind mount; absence is a startup error, never a bypass.
    include /etc/nginx/proxy-admin-auth.conf;
    # Docker DNS is resolved again after containers are replaced during upgrade.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen unix:/gateway/pindou.sock;
        server_name _;
        absolute_redirect off;
        set $api http://api:3112;
        set $web http://web:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A conversion consumes quota and may call a paid provider. Never replay it.
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        # Allow the 300s AI read timeout plus upload and local processing time.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_redirect off;

        location = /app/pindou/readyz {
            access_log off;
            proxy_pass $api/readyz;
        }
        location = /app/pindou/api/v1 {
            proxy_redirect ~^https?://[^/]+(/api/v1(?:[/?].*)?)$ /app/pindou$1;
            proxy_redirect ~^(/api/v1(?:[/?].*)?)$ /app/pindou$1;
            proxy_pass $api/api/v1$is_args$args;
        }
        # Normalize trailing slashes internally, retaining POST bodies and query.
        location = /app/pindou/api/v1/image-deliveries/ {
            rewrite ^ /app/pindou/api/v1/image-deliveries last;
        }
        location = /app/pindou/api/v1/access-keys/ {
            rewrite ^ /app/pindou/api/v1/access-keys last;
        }
        location = /app/pindou/api/v1/image-deliveries {
            include /etc/nginx/proxy-admin-headers.conf;
            proxy_pass $api/api/v1/image-deliveries$is_args$args;
        }
        location = /app/pindou/api/v1/access-keys {
            include /etc/nginx/proxy-admin-headers.conf;
            proxy_pass $api/api/v1/access-keys$is_args$args;
        }
        location ^~ /app/pindou/api/v1/ {
            # FastAPI slash redirects must retain the gateway prefix and scheme.
            # A relative Location lets the browser keep the external HTTPS origin.
            proxy_redirect ~^https?://[^/]+(/api/v1(?:[/?].*)?)$ /app/pindou$1;
            proxy_redirect ~^(/api/v1(?:[/?].*)?)$ /app/pindou$1;
            rewrite ^/app/pindou(/api/v1/.*)$ $1 break;
            proxy_pass $api$uri$is_args$args;
        }
        location = /app/pindou { proxy_pass $web$request_uri; }
        location /app/pindou/ { proxy_pass $web$request_uri; }
        location / { return 404; }
    }
}
