# Local proxy_set_header directives replace the entire inherited header list.
# Keep the ordinary gateway headers as well as the POST-only admin override.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Admin-API-Key $pindou_admin_api_key;
