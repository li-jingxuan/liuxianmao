when:
  - event: manual
    branch: main

# 全量发布等两张同提交的镜像都就绪后再切换。Woodpecker 单选此项时也会运行这些依赖。
depends_on:
  - build-gateway
  - build-liuxianmao

skip_clone: true

steps:
  - name: checkout-main
    image: quay.io/woodpeckerci/plugin-git:2.11.0
    environment:
      HTTPS_PROXY: http://172.17.0.1:7890
    commands:
      # 各工作流使用独立工作区。通过 NAS 出口代理检出触发时的提交，并核对 SHA。
      - |
        case "${RELEASE_ACTION:-}" in
          ''|check|deploy|rollback) ;;
          *) echo 'RELEASE_ACTION must be check, deploy or rollback' >&2; exit 2 ;;
        esac
        test "$CI_REPO" = li-jingxuan/liuxianmao
        test -n "$CI_COMMIT_SHA"
        export GIT_TERMINAL_PROMPT=0
        # Docker 可能用不同 UID 创建共享工作区。只信任当前任务的工作目录。
        git config --global --add safe.directory "$PWD"
        git init -q
        attempt=1
        until timeout 90 git -c http.version=HTTP/1.1 fetch --depth=1 --no-tags \
          https://github.com/li-jingxuan/liuxianmao.git "$CI_COMMIT_SHA"; do
          test "$attempt" -lt 3 || exit 1
          attempt=$((attempt + 1))
          sleep 3
        done
        test "$(git rev-parse FETCH_HEAD)" = "$CI_COMMIT_SHA"
        git checkout --detach FETCH_HEAD

  - name: deploy-and-verify-on-nas
    image: quay.io/woodpeckerci/plugin-git:2.11.0
    when:
      - evaluate: 'RELEASE_ACTION != "check"'
    environment:
      LXM_NAS_SSH_HOST: 172.17.0.1
      LXM_NAS_SSH_KEY:
        from_secret: lxm_nas_ssh_key
      LXM_NAS_KNOWN_HOSTS:
        from_secret: lxm_nas_known_hosts
    commands:
      - sh deploy/fnos/ci-release.sh deploy-all
