<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节奏型与小节编号交互稿</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; font: 14px/1.5 system-ui, sans-serif; color: #1f2937; background: #eef2f6; --line: #e1e6ee; --muted: #64748b; --blue: #095cca; --blue-wash: #edf5ff; }
  body { margin: 0; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: white; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button:hover:not(:disabled) { border-color: #6ba6f0; color: var(--blue); }
  button:disabled { cursor: default; color: var(--muted); }
  button:focus-visible, select:focus-visible { outline: 2px solid #1677ff; outline-offset: 2px; }
  button[aria-pressed="true"], button[aria-selected="true"] { color: var(--blue); background: var(--blue-wash); border-color: #83b6fa; }
  button.primary { color: white; background: #095cca; border-color: #095cca; }
  button.primary:hover:not(:disabled) { color: white; background: #044caa; }
  .bar, .actions, .title, .trial { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar { padding: 10px 16px; background: white; border-bottom: 1px solid var(--line); }
  .trial { margin-left: auto; font-size: 12px; color: var(--muted); }
  select { border: 1px solid var(--line); background: white; border-radius: 5px; padding: 4px; }
  .workspace { display: grid; grid-template-columns: minmax(0,1fr) 360px; align-items: start; min-height: calc(100dvh - 55px); }
  .paper { margin: 24px; padding: clamp(18px, 4vw, 54px); background: white; min-width: 0; }
  .paper h1 { font-size: 24px; text-align: center; margin: 4px 0 28px; }
  .staff { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); margin: 52px 0 58px; }
  .measure { position: relative; border: 0; border-radius: 0; background: white; border-left: 1px solid #3a4757; height: 80px; padding: 0 5px; }
  .measure:last-child { border-right: 1px solid #3a4757; }
  .measure[aria-pressed="true"] { background: #f3f8ff; border-color: #3a4757; }
  .measure .lines { position: absolute; inset: 19px 0 auto; height: 41px; background: repeating-linear-gradient(to bottom,#3a4757 0 1px, transparent 1px 8px); }
  .measure .fingers { position: absolute; inset: 31px 7px auto; display: flex; justify-content: space-around; color: #253246; font: 12px/1.2 ui-monospace, monospace; }
  .measure .fingers span { background: #fff; padding-inline: 2px; }
  .number { position: absolute; top: 5px; right: 5px; color: var(--muted); font: 11px/1 ui-monospace, monospace; }
  .measure[aria-pressed="true"] .number { color: var(--blue); font-weight: 700; }
  .chord { position: absolute; top: -32px; left: 14%; color: #253246; line-height: 1; text-align: center; }
  .chord-grid { display: block; width: 16px; height: 12px; margin: 3px auto 0; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; background: repeating-linear-gradient(to right, currentColor 0 1px, transparent 1px 3px), repeating-linear-gradient(to bottom, currentColor 0 1px, transparent 1px 4px); }
  .technique { position: absolute; top: 6px; right: 19%; width: 26%; height: 10px; border-top: 1px solid #314056; border-radius: 50% 50% 0 0; color: #253246; font-size: 9px; line-height: 1; }
  .technique b { position: relative; top: -9px; background: white; padding-inline: 2px; }
  .beat-mark { position: absolute; inset: auto 6px 3px; text-align: center; font-size: 15px; letter-spacing: 2px; }
  .summary { color: var(--muted); font-size: 12px; min-height: 18px; margin: 0; }
  aside { min-width: 0; background: white; padding: 12px; border-left: 1px solid var(--line); }
  .title { justify-content: space-between; margin-bottom: 7px; }
  .title h2 { font-size: 14px; margin: 0; }
  .tabs { display: flex; gap: 4px; padding: 3px; background: #f1f4f8; border-radius: 7px; margin-bottom: 8px; }
  .tabs button { flex: 1; font-size: 12px; padding: 3px 8px; border-color: transparent; background: transparent; }
  .tabs button[aria-pressed="true"] { background: white; border-color: var(--line); }
  .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px; }
  .choice { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; padding: 5px 7px; text-align: left; }
  .choice span:first-child { font-size: 12px; color: var(--muted); }
  .choice[aria-pressed="true"] span:first-child { color: var(--blue); }
  .notation { display: flex; flex-wrap: wrap; color: inherit; }
  .notation .beat { display: inline-flex; align-items: flex-end; gap: 2px; padding-inline: 3px; height: 19px; }
  .notation .beat + .beat { border-left: 1px solid #ccd5e1; }
  .grid.measure-list { grid-template-columns: 1fr; }
  .measure-list .choice { flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; min-height: 40px; }
  .measure-list .choice > span:first-child { min-width: 4.5em; font-size: 12px; }
  .measure-list .notation { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .measure-list .notation .beat { justify-content: center; }
  .note { position: relative; display: inline-block; width: 7px; height: 16px; }
  .note::before { content: ''; position: absolute; bottom: 2px; left: 0; width: 5px; height: 4px; background: currentColor; border-radius: 55%; transform: rotate(-22deg); }
  .note::after { content: ''; position: absolute; top: 0; left: 4px; width: 1px; height: 12px; background: currentColor; }
  .note i { position: absolute; top: calc(var(--flag) * 3px); left: 4px; width: 3px; height: 1px; background: currentColor; transform: rotate(30deg); }
  .note.dotted { width: 10px; }
  .note.dotted b { position: absolute; bottom: 4px; right: 0; width: 2px; height: 2px; border-radius: 50%; background: currentColor; }
  .preview { margin-top: 9px; padding: 7px 8px; background: #f6f8fb; border-radius: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .pair > div { min-width: 0; }
  .pair b { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
  .actions { margin-top: 8px; justify-content: flex-end; }
  .actions .summary { margin-right: auto; }
  .popup { position: absolute; z-index: 2; top: 52px; left: 16px; width: min(600px, calc(100% - 32px)); background: white; padding: 12px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px #0c284527; }
  .popup .grid:not(.measure-list) { grid-template-columns: repeat(3,minmax(0,1fr)); }
  dialog { width: min(440px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 8px; padding: 16px; color: inherit; }
  dialog::backdrop { background: #1d304266; }
  dialog h2 { margin: 0; font-size: 16px; }
  [hidden] { display: none !important; }
  @media (max-width: 790px) { .workspace { grid-template-columns: 1fr; } .paper { margin: 12px; } aside { border: 0; } }
  @media (max-width: 460px) { .popup { top: 80px; } .popup .grid:not(.measure-list) { grid-template-columns: repeat(2,minmax(0,1fr)); } .trial { margin-left: 0; } }
</style>
<header class="bar">
  <button id="undo" disabled>撤销</button>
  <button id="trigger" type="button" aria-expanded="false" aria-controls="popup">♫ 节奏型</button>
  <div class="trial">
    <label>拍号 <select id="meter"><option>4/4</option><option>3/4</option><option>6/8</option></select></label>
    <label>谱层 <select id="layer"><option>六线谱</option><option>简谱</option></select></label>
    <label><input type="checkbox" id="marked"> 当前小节有技巧</label>
  </div>
</header>
<section class="popup" id="popup" aria-label="工具栏节奏型" hidden></section>
<main class="workspace">
  <section class="paper" aria-label="曲谱预览">
    <h1>练习曲</h1>
    <p class="summary" id="signature"></p>
    <div id="score"></div>
    <p class="summary" id="feedback" role="status"></p>
  </section>
  <aside id="sidebar" aria-label="选区侧栏"></aside>
</main>
<dialog id="confirm"><h2>移除受影响的技巧？</h2><p id="impact"></p><div class="actions"><button id="cancel">取消</button><button class="primary" id="confirmApply">确认应用</button></div></dialog>
<script>
  const find = id => document.getElementById(id);
  const common = [
    ['四分音符',[4]],['两个八分',[2,2]],['前八后十六',[2,1,1]],['前十六后八',[1,1,2]],
    ['四个十六分',[1,1,1,1]],['附点八分＋十六',[3,1]],['小切分',[1,2,1]],['十六＋附点八分',[1,3]],
    ['附点八分＋两三十二',[3,.5,.5]],['两三十二＋附点八分',[.5,.5,3]],['八分＋四三十二',[2,.5,.5,.5,.5]],['四三十二＋八分',[.5,.5,.5,.5,2]],
  ];
  const compound = [['附点四分',[6]],['三个八分',[2,2,2]],['四分＋八分',[4,2]],['八分＋四分',[2,4]],['六个十六分',[1,1,1,1,1,1]]];
  const presets = {
    '4/4': [['交替分解',[2,4,2,4]],['均匀八分',[1,1,1,1]],['附点推进',[5,1,5,1]],['先疏后密',[0,1,2,4]]],
    '3/4': [['首拍稳定',[0,1,1]],['交替分解',[2,4,2]],['均匀八分',[1,1,1]],['末拍细分',[1,1,4]]],
    '6/8': [['均匀八分',[1,1]],['长短对照',[2,3]],['首拍延展',[0,1]],['末拍延展',[1,0]]],
  };
  const state = { measure: 2, mode: 'measure', template: 0, applied: {}, history: [] };
  const meter = () => find('meter').value;
  const layer = () => find('layer').value;
  const patterns = () => meter() === '6/8' ? compound : common;
  const meterBeats = () => ({ '4/4': 4, '3/4': 3, '6/8': 2 })[meter()];
  const key = (number = state.measure) => `${meter()}/${layer()}/${number}`;
  const before = () => state.applied[key()] ?? Array(meterBeats()).fill(0);
  const options = () => state.mode === 'measure' ? presets[meter()] : patterns().map(([label], index) => [label,[index]]);
  const after = () => state.mode === 'measure' ? options()[state.template][1] : [state.template,...before().slice(1)];
  const note = value => {
    const flags = ({ 0.5: 3, 1: 2, 2: 1, 3: 1, 4: 0, 6: 0 })[value];
    const dotted = value === 3 || value === 6;
    return `<span class="note${dotted ? ' dotted' : ''}">${Array.from({length: flags}, (_, index) => `<i style="--flag:${index}"></i>`).join('')}${dotted ? '<b></b>' : ''}</span>`;
  };
  const notes = values => `<span class="notation" aria-label="${values.map(i => patterns()[i][0]).join('，')}">${values.map(i => `<span class="beat" aria-hidden="true">${patterns()[i][1].map(note).join('')}</span>`).join('')}</span>`;
  const same = () => before().join() === after().join();
  function drawScore() {
    find('signature').textContent = `${meter()} · ${layer()}`;
    find('score').innerHTML = [0,1].map(system => `<div class="staff">${Array.from({length: 4}, (_, offset) => {
      const n = system * 4 + offset + 1;
      const symbols = layer() === '六线谱' ? ['0','2','2','1','0'] : ['1','3','5','6','5'];
      const chord = ['C','Gadd9','Am','F','Dm','Em','F','G'][n-1];
      return `<button class="measure" data-measure="${n}" type="button" aria-label="第 ${n} 小节" aria-pressed="${state.measure === n}"><span class="chord" aria-hidden="true">${chord}<span class="chord-grid"></span></span><span class="technique" aria-hidden="true"><b>${n % 2 ? 'H' : 'P'}</b></span><span class="number" aria-hidden="true">${n}</span><span class="lines" aria-hidden="true"></span><span class="fingers" aria-hidden="true">${symbols.map((s,i) => `<span style="transform:translateY(${i % 3 * 8}px)">${s}</span>`).join('')}</span>${state.applied[key(n)] ? `<span class="beat-mark">${notes(state.applied[key(n)])}</span>` : ''}</button>`;
    }).join('')}</div>`).join('');
  }
  function drawPanel(panel) {
    panel.innerHTML = `<div class="title"><h2>${panel.id === 'popup' ? '节奏型' : '常见节奏型'}</h2><span class="summary">第 ${state.measure} 小节 · ${meter()} · ${layer()}${state.mode === 'beat' ? ' · 第 1 拍' : ''}</span></div>
      <div class="tabs" role="group" aria-label="节奏型范围"><button data-mode="beat" aria-pressed="${state.mode === 'beat'}">拍内</button><button data-mode="measure" aria-pressed="${state.mode === 'measure'}">整小节</button></div>
      <div class="grid${state.mode === 'measure' ? ' measure-list' : ''}" role="group" aria-label="可用节奏型">${options().map(([name, values], index) => `<button class="choice" data-template="${index}" aria-pressed="${state.template === index}" title="${values.map(i => patterns()[i][0]).join(' · ')}"><span>${name}</span>${notes(values)}</button>`).join('')}</div>
      <div class="preview"><div class="pair"><div><b>当前</b>${notes(state.mode === 'measure' ? before() : before().slice(0,1))}</div><div><b>应用后</b>${notes(state.mode === 'measure' ? after() : after().slice(0,1))}</div></div></div>
      <div class="actions"><p class="summary">${same() ? '与当前节奏一致' : '逐拍保留音符与休止'}</p><button class="primary" data-apply ${same() ? 'disabled' : ''}>应用</button></div>`;
  }
  function draw() {
    drawScore(); drawPanel(find('sidebar')); drawPanel(find('popup'));
    find('undo').disabled = !state.history.length;
  }
  function closePopup() { find('popup').hidden = true; find('trigger').setAttribute('aria-expanded','false'); }
  function apply() {
    state.history.push({ key: key(), prior: state.applied[key()], marked: find('marked').checked });
    state.applied[key()] = after();
    find('marked').checked = false;
    find('feedback').textContent = `已应用到第 ${state.measure} 小节${state.mode === 'beat' ? '第 1 拍' : ''}，可撤销。`;
    closePopup(); draw(); find('trigger').focus();
  }
  function handlePanel(event) {
    const button = event.target.closest('button');
    if (!button) return;
    const panel = event.currentTarget;
    if (button.dataset.mode) {
      state.mode = button.dataset.mode; state.template = 0; draw();
      panel.querySelector(`[data-mode="${state.mode}"]`).focus();
    } else if (button.dataset.template !== undefined) {
      state.template = Number(button.dataset.template); draw();
      panel.querySelector(`[data-template="${state.template}"]`).focus();
    } else if (button.hasAttribute('data-apply')) {
      if (find('marked').checked) {
        find('impact').textContent = `第 ${state.measure} 小节的击弦会受本次节奏调整影响。确认后移除，可和节奏调整一起撤销。`;
        find('confirm').showModal(); find('cancel').focus();
      } else apply();
    }
  }
  find('sidebar').addEventListener('click',handlePanel);
  find('popup').addEventListener('click',handlePanel);
  find('trigger').onclick = () => {
    if (!find('popup').hidden) { closePopup(); return; }
    find('popup').hidden = false;
    find('trigger').setAttribute('aria-expanded','true');
    find('popup').querySelector(`[data-mode="${state.mode}"]`).focus();
  };
  document.addEventListener('keydown',event => {
    if (event.key === 'Escape' && !find('popup').hidden && !find('confirm').open) { closePopup(); find('trigger').focus(); }
  });
  find('score').onclick = event => {
    const measure = event.target.closest('[data-measure]');
    if (!measure) return;
    state.measure = Number(measure.dataset.measure); closePopup(); draw();
    find('score').querySelector(`[data-measure="${state.measure}"]`).focus();
  };
  find('meter').onchange = () => { state.template = 0; draw(); };
  find('layer').onchange = draw;
  find('cancel').onclick = () => find('confirm').close();
  find('confirmApply').onclick = () => { find('confirm').close(); apply(); };
  find('undo').onclick = () => {
    const entry = state.history.pop();
    if (entry.prior) state.applied[entry.key] = entry.prior; else delete state.applied[entry.key];
    if (entry.key === key()) find('marked').checked = entry.marked;
    find('feedback').textContent = '已撤销上一次节奏型应用。'; draw();
  };
  draw();
</script>
</html>
