<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REQ-069 · 六线谱拍点右键菜单</title>
  <link rel="stylesheet" href="prototype.css?v=menu-anchor-2">
  <script src="prototype.js?v=menu-anchor-2" defer></script>
</head>
<body>
  <header class="review">
    <strong>REQ-069 交互稿</strong>
    <nav aria-label="演示场景">
      <button type="button" data-scene="single" aria-pressed="true">单拍</button>
      <button type="button" data-scene="multiple" aria-pressed="false">同小节多拍</button>
      <button type="button" data-scene="across" aria-pressed="false">跨小节</button>
    </nav>
    <button type="button" id="reset" class="quiet">重置示例</button>
  </header>

  <header class="editor-header">
    <div class="header-start">
      <div class="brand"><img src="../../../../../../apps/website/public/assets/brand/liuxianmao-64.png" alt="">六线猫</div>
      <div class="header-menus" aria-hidden="true">文件　编辑　视图　帮助</div>
    </div>
    <strong class="document-title">风过原野</strong>
    <span class="document-state">示例曲谱</span>
  </header>

  <div class="toolbar" role="toolbar" aria-label="谱面工具栏">
    <button id="undo" type="button" aria-label="撤销" title="撤销" disabled>↶</button>
    <div class="tool-group" aria-hidden="true">
      <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-whole.svg" alt="">
      <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-half.svg" alt="">
      <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-quarter.svg" alt="">
      <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-eighth.svg" alt="">
      <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-sixteenth.svg" alt="">
    </div>
    <div class="tool-group" aria-hidden="true">H　P　S　⌒　↟　↡</div>
    <div class="tool-group" aria-label="浮窗工具">
      <button type="button" data-tool-trigger="technique" aria-label="所有技巧" title="所有技巧" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 18v-6c0-6 8-10 13-6l4 7m-5-1 1-6m0 0 4 2M8 17l2-2 2 3 3-2"/><ellipse cx="4" cy="19" rx="2" ry="1.4" fill="currentColor"/></svg></button>
      <button type="button" data-tool-trigger="rhythm" aria-label="节奏型" title="节奏型" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 18V6l13-3v12M7 9l13-3"/><ellipse cx="4.5" cy="19" rx="2.5" ry="1.6" fill="currentColor"/><ellipse cx="17.5" cy="16" rx="2.5" ry="1.6" fill="currentColor"/></svg></button>
      <button type="button" data-tool-trigger="measure" aria-label="小节工具" title="小节工具" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 2v20" stroke-width="1.5"/><path d="M14 2v20" stroke-width="3"/></svg></button>
      <button type="button" data-tool-trigger="chord" aria-label="添加和弦" title="添加和弦" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16M8 4v16M12 4v16M16 4v16M4 5h12M4 10h12M4 15h12M4 20h12"/><circle cx="8" cy="10" r="1.8" fill="currentColor"/><path id="chord-add-icon" d="M20 3v6m-3-3h6"/></svg></button>
    </div>
  </div>

  <main class="workspace">
    <div id="canvas" class="canvas">
      <article class="paper" aria-label="风过原野曲谱">
        <h1>风过原野</h1>
        <div class="score-meta"><span>1 = C　4/4</span><span>♩ = 84</span></div>
        <div id="score" class="score" role="group" aria-label="六线谱，Shift 点击或拖动选择连续拍点，右键打开菜单"></div>
      </article>
    </div>
    <aside class="inspector" aria-label="选区侧栏">
      <div class="side-tabs" aria-hidden="true"><strong>选区</strong><span>简谱与歌词</span><span>和弦</span><span>歌曲</span></div>
      <div class="inspector-body">
        <section>
          <h2>当前选区</h2>
          <div class="selection-summary"><strong id="selection-location"></strong><small id="selection-detail"></small></div>
        </section>
        <section class="try-it">
          <h2>试用交互</h2>
          <p>在谱面右键打开菜单。拖动或按住 Shift 点击可选连续多拍。</p>
          <p>也可聚焦拍点后按 <kbd>Shift</kbd> + <kbd>F10</kbd>。</p>
        </section>
      </div>
    </aside>
  </main>
  <footer class="statusbar"><span>编辑模式</span><span id="status" role="status"></span><span>100%</span></footer>
  <div id="toast" class="toast" hidden><span id="toast-message" role="status"></span><button type="button" id="toast-undo">撤销</button></div>

  <div id="menu" class="context-menu" hidden>
    <div class="menu-heading"><strong id="menu-title">谱面工具</strong><span id="menu-range"></span></div>
    <div role="menu" aria-labelledby="menu-title" aria-describedby="menu-hint">
      <button type="button" role="menuitem" tabindex="-1" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool" data-action="measure"><span class="action-icon" aria-hidden="true">││</span>小节工具<span class="menu-tail" aria-hidden="true">›</span></button>
      <button type="button" role="menuitem" tabindex="-1" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool" data-action="rhythm"><span class="action-icon" aria-hidden="true">♫</span>节奏型<span class="menu-tail" aria-hidden="true">›</span></button>
      <button type="button" role="menuitem" tabindex="-1" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool" data-action="technique"><span class="action-icon" aria-hidden="true">⌒</span>技巧<span class="menu-tail" aria-hidden="true">›</span></button>
      <button type="button" role="menuitem" tabindex="-1" aria-haspopup="dialog" aria-expanded="false" aria-controls="tool" data-action="chord"><span class="action-icon" aria-hidden="true">▦</span><span id="chord-label">添加和弦</span><span class="menu-tail" aria-hidden="true">›</span></button>
      <div class="menu-divider" role="separator"></div>
      <button type="button" role="menuitem" tabindex="-1" data-action="copy-measure"><span class="action-icon copy-icon" aria-hidden="true"></span>复制当前小节</button>
    </div>
    <p class="menu-hint" id="menu-hint" aria-live="polite"></p>
  </div>

  <section id="tool" class="tool-popover" role="dialog" aria-labelledby="tool-title" tabindex="-1" hidden>
    <header class="tool-heading">
      <h2 id="tool-title"></h2><p id="tool-context"></p>
      <button type="button" class="close technique-delete" data-tool-action="delete-technique" aria-label="删除当前技巧" title="删除当前技巧" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 9v9m4-9v9"/></svg></button>
      <button type="button" id="close-tool" class="close" aria-label="关闭工具">×</button>
    </header>
    <div id="tool-body"></div>
  </section>

</body>
</html>
