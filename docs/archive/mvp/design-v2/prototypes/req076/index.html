<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六线猫 · 木吉他试听评审</title>
  <link rel="stylesheet" href="prototype.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <header class="review" aria-label="原型评审工具">
    <strong>REQ-076 · 试听交互稿</strong>
    <div role="group" aria-label="演示场景">
      <button type="button" data-demo="normal" aria-pressed="true">常规试听</button>
      <button type="button" data-demo="repeat" aria-pressed="false">反复段中起播</button>
      <button type="button" data-demo="failure" aria-pressed="false">音源加载失败</button>
      <button type="button" id="edit-demo">模拟修改品位</button>
    </div>
    <span>静音原型</span>
  </header>

  <div class="editor-header">
    <div class="header-left">
      <div class="brand"><img alt="" src="../../../../../../apps/website/public/assets/brand/liuxianmao-64.png">六线猫</div>
      <div class="menus" aria-hidden="true">文件　编辑　视图　帮助</div>
    </div>
    <strong class="document-title">风吹过山谷</strong>
    <div class="header-right" aria-hidden="true"><span>示例曲谱</span><span class="export">导出 ⌄</span></div>
  </div>

  <div class="toolbar" role="group" aria-label="谱面工具栏">
    <div class="editing-tools" id="editing-tools" aria-label="现有编辑工具示意">
      <div class="editing-row primary-row">
        <div class="editing-group" aria-label="历史"><span>↶</span><span class="unavailable">↷</span></div>
        <div class="editing-group unavailable" aria-label="基础时值">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-whole.svg" alt="全音符">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-half.svg" alt="二分音符">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-quarter.svg" alt="四分音符">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-eighth.svg" alt="八分音符">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-sixteenth.svg" alt="十六分音符">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-thirty-second.svg" alt="三十二分音符">
        </div>
        <div class="editing-group unavailable" aria-label="附点与休止">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-dot.svg" alt="单附点">
          <img src="../../../../../../apps/website/public/assets/svg/music-controls/note-double-dotted.svg" alt="双附点">
          <span title="休止">ʃ</span>
        </div>
      </div>
      <div class="editing-row secondary-row">
        <div class="editing-group unavailable" aria-label="演奏技巧"><span>H</span><span>P</span><span>S</span><span>⌒</span><span>↟</span><span>↡</span><span>⇡</span><span>⇣</span><span>⌁</span></div>
        <div class="editing-group" aria-label="节奏与连音"><span>♫</span><span class="unavailable">⌞3⌟</span></div>
        <div class="editing-group" aria-label="小节"><span>Ⅱ</span></div>
        <div class="editing-group narrow-tools"><span>更多⌄</span></div>
        <div class="editing-group unavailable" aria-label="和弦"><span>▦</span></div>
      </div>
    </div>
    <section id="transport" class="playback-tools" aria-label="木吉他试听工具" hidden>
      <strong class="playback-title">木吉他试听</strong>
      <div class="transport" role="group" aria-label="播放控制">
        <button type="button" class="play" id="play"><span class="play-symbol" aria-hidden="true"></span><span id="play-label">播放</span></button>
        <button type="button" id="stop" class="stop" disabled><span aria-hidden="true"></span>停止</button>
      </div>
      <div class="transport settings" role="group" aria-label="播放设置">
        <select id="start" aria-label="播放起点">
          <option value="beginning">从头开始</option>
          <option value="selected">从当前小节</option>
        </select>
        <label class="tempo">♩ = <input id="tempo" type="number" min="40" max="240" step="1" value="90" required aria-label="速度，每分钟四分音符数"></label>
      </div>
      <button type="button" id="follow" class="follow" aria-pressed="true">跟随谱面</button>
      <span id="progress" class="progress" aria-label="播放位置"></span>
    </section>
    <div class="fixed-tools">
      <button type="button" id="audition" class="fixed-tool audition" aria-label="木吉他试听" title="进入木吉他试听" aria-pressed="false" aria-controls="transport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 11a8 8 0 0 1 16 0v6M4 11v6"/><rect x="3" y="12" width="4" height="7" rx="1.4"/><rect x="17" y="12" width="4" height="7" rx="1.4"/></svg>
      </button>
      <button type="button" id="sidebar" class="fixed-tool" aria-label="编辑面板" title="编辑面板" aria-expanded="true" aria-controls="inspector">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </div>
  </div>

  <main class="workspace">
    <section id="viewport" class="viewport" aria-label="六线谱">
      <article class="paper">
        <h1>风吹过山谷</h1>
        <p class="credit">编谱 · 六线猫</p>
        <div class="score-info"><span>1 = C · 4/4</span><span id="score-tempo">♩ = 90</span></div>
        <div id="score" class="score"></div>
      </article>
    </section>
    <aside id="inspector" class="inspector" aria-label="选区">
      <div class="tabs" aria-hidden="true"><strong>选区</strong><span>简谱与歌词</span><span>和弦</span><span>歌曲</span></div>
      <div class="inspector-body">
        <h2>当前选区</h2>
        <div class="selection-detail"><strong id="selected-fret">0</strong><div><div id="selected-measure">第 2 小节 · 第 1 拍</div><small id="selected-string">第 6 弦 · 0 品</small></div></div>
        <p>点击谱面选中拍点。选择「从当前小节」时，从该小节第一拍起播。</p>
        <div class="repeat-note" id="repeat-note" hidden>
          <h2>反复段回跳</h2>
          <p>从第 2 小节起播，遇到第 3 小节末的反复线时回到第 1 小节。</p>
          <p class="route">2 → 3 → 1 → 2 → 3 → 4</p>
        </div>
      </div>
    </aside>
  </main>

  <footer class="statusbar">
    <span><span class="status-dot" id="status-dot" aria-hidden="true"></span><span id="status" role="status">编辑模式</span></span>
    <span id="selection-status">编辑选区 · 第 2 小节第 1 拍</span>
  </footer>
</body>
</html>
