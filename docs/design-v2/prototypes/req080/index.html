<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六线猫 · REQ-080 简谱弧线</title>
  <link rel="stylesheet" href="./prototype.css">
  <script src="./prototype.js" defer></script>
</head>
<body>
  <header class="review-bar">
    <strong>REQ-080 · 简谱弧线</strong>
    <div class="scenarios" role="group" aria-label="切换评审选区">
      <button type="button" data-case="same" aria-pressed="true">跨小节同音</button>
      <button type="button" data-case="different" aria-pressed="false">相邻异音</button>
      <button type="button" data-case="phrase" aria-pressed="false">多音乐句</button>
      <button type="button" data-case="rest" aria-pressed="false">含休止符</button>
    </div>
  </header>
  <header class="app-header">
    <div class="brand"><img src="../../../../apps/website/public/assets/brand/liuxianmao-64.png" alt=""><b>六线猫</b></div>
    <strong class="document-name">理想</strong>
  </header>
  <div class="toolbar" role="group" aria-label="谱面工具栏">
    <div class="tool-group" role="group" aria-label="编辑历史">
      <button type="button" class="tool" id="undo" aria-label="撤销" title="撤销" disabled>↶</button>
      <button type="button" class="tool" id="redo" aria-label="重做" title="重做" disabled>↷</button>
    </div>
    <div class="tool-group" aria-hidden="true">
      <span class="tool placeholder">♩</span><span class="tool placeholder">♪</span><span class="tool placeholder music-glyph">&#xE4E5;</span>
    </div>
    <div class="tool-group">
      <span class="tool placeholder" aria-hidden="true">H</span><span class="tool placeholder" aria-hidden="true">P</span><span class="tool placeholder" aria-hidden="true">S</span>
      <div class="arc-anchor" id="arc-anchor">
        <button type="button" class="tool arc-trigger" id="arc-trigger" aria-label="弧线" title="弧线" aria-expanded="true" aria-controls="arc-popover"><i class="curve" aria-hidden="true"></i></button>
        <section class="popover" id="arc-popover" role="group" aria-label="选择简谱弧线">
          <div class="commands">
            <button class="command" type="button" data-command="tie" aria-labelledby="tie-label tie-recommendation" aria-describedby="tie-detail">
              <i class="curve curve-tie" aria-hidden="true"></i><strong class="command-label" id="tie-label">延音线</strong><span class="recommendation" id="tie-recommendation">推荐</span><span class="command-detail" id="tie-detail">同音持续发声</span>
            </button>
            <button class="command" type="button" data-command="slur" aria-labelledby="slur-label" aria-describedby="slur-detail">
              <i class="curve curve-slur" aria-hidden="true"></i><strong class="command-label" id="slur-label">圆滑线</strong><span class="recommendation" id="slur-recommendation" hidden>推荐</span><span class="command-detail" id="slur-detail">各音保留原时值</span>
            </button>
          </div>
        </section>
      </div>
      <span class="tool placeholder" aria-hidden="true">⇡</span><span class="tool placeholder" aria-hidden="true">⇣</span>
    </div>
    <div class="tool-group" aria-hidden="true">
      <span class="tool placeholder">♫</span><span class="tool placeholder">𝄀</span>
    </div>
  </div>

  <main class="workspace">
    <article class="paper" aria-label="理想曲谱示例">
      <header class="score-title"><h1>理想</h1><p>1 = G　4/4</p></header>
      <div class="score" id="score" aria-label="两行六线谱及简谱，蓝色区域为本次评审选区"></div>
    </article>
  </main>
  <footer class="statusbar"><span>简谱</span><output id="feedback" role="status"></output></footer>
</body>
</html>
