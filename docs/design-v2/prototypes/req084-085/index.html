<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六线猫 · REQ-084 / REQ-085 交互稿</title>
  <style>
    :root {
      --ink: #26364a; --muted: #63748a; --border: #d8e2f0;
      --canvas: #f2f5fa; --paper: #fff; --blue: #1677ff; --blue-text: #1559b6; --selected: #edf3ff;
      --shadow: 0 10px 30px #20385326, 0 2px 6px #20385312;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1440px; background: var(--canvas); }
    button { color: inherit; background: none; border: 0; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }
    .app, .toolbar, .status, .review { display: flex; align-items: center; gap: 12px; }
    .app, .toolbar, .status { padding: 0 22px; background: var(--paper); border-bottom: 1px solid var(--border); }
    .app { height: 48px; position: relative; }
    .brand { display: flex; align-items: center; gap: 8px; color: var(--blue-text); }
    .brand img { width: 28px; height: 28px; }
    .app .name { position: absolute; left: 50%; translate: -50%; }
    .app .saved { margin-left: auto; color: var(--muted); font-size: 12px; }
    .app .menus { color: var(--muted); word-spacing: 14px; }
    .toolbar { height: 42px; gap: 8px; }
    .toolbar button { padding: 4px 10px; border-radius: 5px; }
    .toolbar button:hover:not(:disabled), .toolbar button[aria-expanded="true"] { color: var(--blue-text); background: var(--selected); }
    .toolbar button:disabled { color: #a3afc1; }
    .toolbar .divider { height: 22px; border-left: 1px solid var(--border); }
    .workspace { padding: 24px 0 46px; min-height: calc(100vh - 90px); }
    .paper { width: 1110px; min-height: 650px; margin: auto; padding: 30px 64px; background: var(--paper); }
    .paper h1 { text-align: center; margin: 0; font-size: 25px; font-weight: 650; color: #151b25; }
    .paper .credit { text-align: center; font-size: 12px; color: var(--muted); margin: 2px 0 28px; }
    .signature { margin-bottom: 30px; color: #151b25; }
    .score-row { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 65px; }
    .measure { position: relative; height: 46px; min-width: 0; border-left: 1px solid #29323f;
      border-bottom: 1px solid #29323f; background: repeating-linear-gradient(180deg, #29323f 0 1px, white 1px 9px); }
    .measure:last-child { border-right: 1px solid #29323f; }
    .measure-no { position: absolute; top: -20px; left: 5px; color: var(--muted); font-size: 11px; }
    .chord { position: absolute; top: -24px; left: 29px; font-weight: 600; color: #151b25; }
    .beats { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; }
    .beat { position: relative; justify-self: center; width: 30px; height: 46px; padding: 0;
      display: grid; justify-items: center; grid-template-rows: repeat(6, 9px); align-content: center; color: #151b25; }
    .beat span { background: white; min-width: 9px; line-height: 9px; font: 10px/9px ui-monospace, monospace; }
    .beat::after { content: ""; position: absolute; left: 50%; top: 100%; height: 15px; border-left: 1px solid currentColor; }
    .beat.selected { outline: 1px solid #5da2ff; border-radius: 3px; background: #ebf4ffe6; color: var(--blue-text); }
    .beat.selected span { background: #ebf4ff; }
    .beat b { position: absolute; left: 2px; bottom: 2px; font-size: 17px; color: var(--blue-text); }
    .copied .measure-no { background: var(--selected); color: var(--blue-text); }
    .status { position: fixed; bottom: 0; width: 100%; height: 28px; justify-content: space-between; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .review { position: fixed; z-index: 5; top: 52px; right: 18px; gap: 6px;
      padding: 5px; background: #25364b; color: white; box-shadow: var(--shadow); border-radius: 8px; font-size: 12px; }
    .review span { padding: 0 7px; }
    .review button { border-radius: 5px; padding: 6px 10px; }
    .review button:hover { background: #ffffff24; }
    .review button[aria-pressed="true"] { background: white; color: #25364b; }
    .overlay { position: fixed; z-index: 10; background: var(--paper); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); }
    .context { width: 262px; padding: 5px; }
    .context header { display: grid; padding: 6px 9px 7px; }
    .context header span, .hint, .scope { color: var(--muted); font-size: 12px; }
    .context button { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 8px;
      text-align: left; font-size: 13px; font-weight: 550; border-radius: 5px; }
    .context button:hover:not(:disabled), .context button[aria-expanded="true"] { background: var(--selected); color: var(--blue-text); }
    .context .copy-trigger { border-top: 1px solid var(--border); margin-top: 4px; height: 39px; }
    .context i { width: 22px; text-align: center; font-style: normal; font-size: 15px; }
    .copy-icon::before, .copy-icon::after { content: ""; position: absolute; width: 9px; height: 11px; border: 1px solid currentColor; border-radius: 1px; }
    .copy-icon { position: relative; height: 18px; }
    .copy-icon::before { top: 1px; left: 7px; }
    .copy-icon::after { top: 4px; left: 4px; background: var(--paper); }
    .copy-trigger[aria-expanded="true"] .copy-icon::after { background: var(--selected); }
    .context b { margin-left: auto; color: var(--muted); }
    .hint { margin: 4px 0 0; background: var(--canvas); border-radius: 5px; padding: 8px; }
    .techniques { width: 398px; padding: 12px 13px; }
    .popover-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h2, h3, p { margin: 0; }
    h2 { font-size: 16px; font-weight: 650; }
    h3 { font-size: 13px; font-weight: 650; }
    .close { width: 26px; height: 26px; border-radius: 5px; font-size: 19px; line-height: 1; }
    .close:hover { background: var(--canvas); }
    .techniques h4 { margin: 9px 0 5px; font-size: 11px; font-weight: 500; color: var(--muted); }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tile, .direction-choice { border: 1px solid var(--border); background: var(--paper); border-radius: 5px; }
    .tile { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 8px; font-size: 12px; text-align: left; white-space: nowrap; }
    .tile i { width: 19px; font-style: normal; text-align: center; font-size: 15px; }
    .tile:disabled { background: #f4f6f9; color: #8190a4; border-color: #e4e9f1; }
    .tile:hover:not(:disabled), .tile[aria-expanded="true"], .tile[data-applied="true"], .direction-choice[aria-pressed="true"] {
      background: var(--selected); color: var(--blue-text); border-color: var(--blue); }
    .direction { width: 218px; padding: 10px; }
    .direction .scope { margin-top: 2px; }
    .direction-choices { display: flex; gap: 6px; margin-top: 8px; }
    .direction-choice { flex: 1; font-size: 12px; min-height: 32px; }
    .direction-choice:hover { border-color: var(--blue); color: var(--blue-text); }
    .arrow::before { content: ""; position: absolute; top: var(--arrow-y, 16px); width: 9px; height: 9px; background: var(--paper);
      border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); left: -6px; transform: rotate(45deg); }
    .arrow[data-side="left"]::before { left: auto; right: -6px; transform: rotate(225deg); }
    .arrow[data-side="bottom"]::before, .arrow[data-side="top"]::before { left: var(--arrow-x); top: -6px; transform: rotate(135deg); }
    .arrow[data-side="top"]::before { top: auto; bottom: -6px; transform: rotate(-45deg); }
    .destinations { width: 224px; padding: 5px; }
    .destinations header { padding: 5px 6px 6px; }
    .locations { max-height: 253px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 2px; }
    .location { display: block; width: 100%; text-align: left; border-radius: 5px; padding: 7px 9px; font-size: 13px; }
    .location:hover, .location[aria-pressed="true"] { background: var(--selected); color: var(--blue-text); }
    .location:focus-visible { outline-offset: -2px; }
    .copy-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 7px 4px 2px; border-top: 1px solid var(--border); }
    .copy-actions button { border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; font-size: 12px; }
    .copy-actions .primary { background: #155fc7; color: white; border-color: #155fc7; }
    .copy-actions .primary:disabled { background: #f4f6f9; color: var(--muted); border-color: var(--border); }
  </style>
  <script src="./prototype.js" defer></script>
</head>
<body>
  <header class="app">
    <strong class="brand"><img src="../../../../apps/website/public/assets/brand/liuxianmao-64.png" alt="">六线猫</strong>
    <span class="menus">文件 编辑 视图 帮助</span><strong class="name">理想</strong><span class="saved">示例曲谱</span>
  </header>
  <div class="toolbar">
    <button type="button" id="undo" aria-label="撤销" title="撤销" disabled>↶</button><span class="divider"></span>
    <button type="button" id="toolbar-technique" aria-expanded="false" aria-controls="techniques">⌒　技巧</button>
  </div>
  <main class="workspace">
    <article class="paper" aria-label="示例六线谱">
      <h1>理想</h1><p class="credit">编谱 · 六线猫</p><p class="signature">1 = G　4/4</p>
      <div id="score"></div>
    </article>
  </main>
  <footer class="status"><span id="selection"></span><span id="result" role="status"></span></footer>
  <nav class="review" aria-label="交互稿演示">
    <span>交互稿</span><button type="button" id="demo-technique">技巧方向</button>
    <button type="button" data-mode="direct" aria-pressed="true">复制 · 点选即复制</button>
    <button type="button" data-mode="confirm" aria-pressed="false">复制 · 再确认</button>
  </nav>

  <section id="context" class="overlay context" aria-label="谱面工具" hidden>
    <header><strong>谱面工具</strong><span id="context-scope"></span></header>
    <button type="button" disabled><i aria-hidden="true">││</i>小节工具<b aria-hidden="true">›</b></button>
    <button type="button" disabled><i aria-hidden="true">♫</i>节奏型<b aria-hidden="true">›</b></button>
    <button type="button" id="context-technique" aria-expanded="false" aria-controls="techniques"><i aria-hidden="true">⌒</i>技巧<b aria-hidden="true">›</b></button>
    <button type="button" disabled><i aria-hidden="true">▦</i>添加和弦<b aria-hidden="true">›</b></button>
    <button type="button" id="copy-trigger" class="copy-trigger" aria-expanded="false" aria-controls="destinations"><i class="copy-icon" aria-hidden="true"></i>复制当前小节<b aria-hidden="true">›</b></button>
    <p class="hint" id="context-hint">调整当前小节的小节线，或管理小节。</p>
  </section>

  <section id="techniques" class="overlay techniques" role="dialog" aria-labelledby="techniques-title" hidden>
    <header class="popover-head"><h2 id="techniques-title">所有技巧</h2><button type="button" id="close-techniques" class="close" aria-label="关闭所有技巧">×</button></header>
    <h4>音符连接</h4><div class="tiles">
      <button class="tile" disabled><i aria-hidden="true">⌒</i>击弦 H</button><button class="tile" disabled><i aria-hidden="true">⌒</i>勾弦 P</button><button class="tile" disabled><i aria-hidden="true">↗</i>上滑音</button>
      <button class="tile" disabled><i aria-hidden="true">↘</i>下滑音</button><button class="tile" disabled><i aria-hidden="true">⌒</i>延音线</button>
    </div>
    <h4>音高与修饰</h4><div class="tiles">
      <button class="tile" disabled><i aria-hidden="true">⤴</i>推弦</button><button class="tile" disabled><i aria-hidden="true">∿</i>颤音</button><button class="tile" disabled><i aria-hidden="true">◇</i>自然泛音</button>
      <button class="tile" disabled><i aria-hidden="true">◇</i>人工泛音</button><button class="tile" disabled><i aria-hidden="true">⊤</i>点弦 T</button><button class="tile" disabled><i aria-hidden="true">tr</i>颤音奏 tr</button>
    </div>
    <h4>演奏方向与范围</h4><div class="tiles">
      <button type="button" class="tile" data-technique="strum" aria-expanded="false" aria-controls="direction"><i aria-hidden="true">⇣</i>扫弦</button>
      <button type="button" class="tile" data-technique="arpeggio" aria-expanded="false" aria-controls="direction"><i aria-hidden="true">∿</i>琶音</button>
      <button class="tile" disabled><i aria-hidden="true">▽</i>拨片方向</button><button class="tile" disabled><i aria-hidden="true">P.M.</i>手掌闷音</button><button class="tile" disabled><i aria-hidden="true">—</i>Let Ring</button>
    </div>
    <section id="direction" class="overlay arrow direction" role="dialog" aria-labelledby="direction-title" hidden>
      <h3 id="direction-title"></h3><p class="scope" id="direction-scope"></p><div class="direction-choices" id="direction-choices"></div>
    </section>
  </section>

  <section id="destinations" class="overlay arrow destinations" role="dialog" aria-labelledby="destinations-title" hidden>
    <header><h3 id="destinations-title">复制到</h3><p class="scope" id="copy-source"></p></header>
    <div class="locations" id="locations"></div>
    <div id="copy-actions" class="copy-actions" hidden><button type="button" id="cancel-copy">取消</button><button type="button" id="confirm-copy" class="primary" disabled>复制小节</button></div>
  </section>
</body>
</html>
