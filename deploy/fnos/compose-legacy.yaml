services:
  gateway:
    # 旧发布记录的网关与应用共用镜像，回滚到旧版本时沿用 NAS 上原有的代理文件。
    volumes:
      - type: bind
        source: ./proxy.cjs
        target: /deployment/proxy.cjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./verify.cjs
        target: /deployment/verify.cjs
        read_only: true
        bind:
          create_host_path: false
