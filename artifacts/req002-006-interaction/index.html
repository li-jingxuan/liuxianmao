function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tipAttr(message){return ' data-tip="'+escapeHTML(message)+'"';}
function selectedNotes(){return selection?selection.indices.map(i=>model.notes[selection.measure][i]):[];}
function singleBeat(){return selection&&selection.indices.length&&new Set(selection.indices.map(i=>Math.floor(i/2))).size===1&&selection.kind!=='multi';}

function segmentHTML(){return '<div class="segments" role="tablist" aria-label="选区编辑类型">'+[['note','音符'],['measure','小节'],['tuplet','连音']].map(([id,name])=>'<button role="tab" aria-selected="'+(tab===id)+'" class="'+(tab===id?'active':'')+'" data-tab="'+id+'">'+name+'</button>').join('')+'</div>';}

function renderReview(){const names=[['none','未选择'],['note','音符'],['multi','多拍选区'],['measure','小节'],['tuplet','连音']];$('#review-states').innerHTML=names.map(([id,label])=>'<button data-review="'+id+'" class="'+((!selection&&id==='none')||(selection&&(id===tab&&selection.kind!=='multi'||id==='multi'&&selection.kind==='multi'&&tab==='note'))?'active':'')+'">'+label+'</button>').join('');$('#review-members').value=memberCount;$('#review-condition').value=condition;}
function renderToolbar(){let enabled=singleBeat()&&tab==='note';$('#toolbar-duration').innerHTML=durations.map(([id,name])=>'<button class="tool" data-duration="'+id+'" aria-label="'+name+'" '+(!enabled?'disabled':'')+tipAttr(name)+'>'+iconNote(id,0,20)+'</button>').join('');$('#undo').disabled=!history.length;}

function renderAll(){renderScore();renderSidebar();renderReview();renderToolbar();updateStatus();}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');$('#live').textContent=message;toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200);}
function mutate(label,fn){history.push({model:clone(model),selection:clone(selection),tab,pending});fn();$('#edit-status').textContent='已修改';renderAll();notify(label);}
function undo(){if(!history.length)return;let prev=history.pop();model=prev.model;selection=prev.selection;tab=prev.tab;pending=prev.pending;if(pending&&selection&&ratioReason(pending))pending=null;renderAll();$('#edit-status').textContent=history.length?'已修改':'谱面就绪';notify('已撤销，恢复上一处编辑');}
function applyScale(){let scale=zoom/100;$('#score-frame').style.width=760*scale+'px';$('#score-frame').style.height=1010*scale+'px';let svg=$('#score-svg');if(svg)svg.style.transform='scale('+scale+')';$('#zoom-text').textContent=zoom+'%';$('#zoom-minus').disabled=zoom===100;$('#zoom-plus').disabled=zoom===200;$('#zoom-menu').innerHTML=[100,125,150,200].map(v=>'<button role="menuitemradio" aria-checked="'+(v===zoom)+'" data-zoom="'+v+'" class="'+(v===zoom?'active':'')+'">'+v+'% <span>'+(v===zoom?'✓':'')+'</span></button>').join('');}
function setZoom(v){let scroller=$('#canvas-scroll'),before=zoom/100,cx=(scroller.scrollLeft+scroller.clientWidth/2-34)/before,cy=(scroller.scrollTop+scroller.clientHeight/2-30)/before;zoom=v;applyScale();scroller.scrollLeft=Math.max(0,cx*zoom/100-scroller.clientWidth/2+34);scroller.scrollTop=Math.max(0,cy*zoom/100-scroller.clientHeight/2+30);closeZoom();$('#live').textContent='谱面缩放 '+zoom+'%';}
function closeZoom(){$('#zoom-menu').hidden=true;$('#zoom-toggle').setAttribute('aria-expanded','false');}
function revalidatePending(){if(pending&&(!selection||ratioReason(pending)))pending=null;}
function setSelection(next,nextTab){selection=next;tab=nextTab;revalidatePending();renderAll();}
function selectReview(kind){pending=null;condition='valid';if(kind==='none'){selection=null;tab='note';}else if(kind==='multi'){selection={kind:'multi',measure:4,indices:[2,3,4,5]};tab='note';}else if(kind==='measure'){selection={kind:'measure',measure:4,indices:[2]};tab='measure';}else if(kind==='tuplet'){selection={kind:'tuplet',measure:4,indices:Array.from({length:memberCount},(_,i)=>i)};tab='tuplet';}else{selection={kind:'note',measure:4,indices:[2]};tab='note';}renderAll();}
function changeTab(next){if(!selection)selection={kind:next,measure:4,indices:[2]};if(next==='tuplet'){let group=model.tuplets[selection.measure];let indices=group?group.members:Array.from({length:memberCount},(_,i)=>i);selection={kind:'tuplet',measure:selection.measure,indices:[...indices]};memberCount=indices.length;}else if(next==='measure')selection.kind='measure';else selection.kind=selection.indices.length>2?'multi':'note';tab=next;pending=null;condition='valid';renderAll();}
function setDuration(value){if(!singleBeat()||tab!=='note')return;mutate(durations.find(v=>v[0]===value)[1]+'已应用',()=>{let beat=Math.floor(selection.indices[0]/2);model.notes[selection.measure].forEach((note,i)=>{if(Math.floor(i/2)===beat)note.duration=value;});});}
function setDots(value){if(!singleBeat()||tab!=='note')return;mutate(['已移除附点','已应用附点','已应用复附点'][value],()=>{let beat=Math.floor(selection.indices[0]/2);model.notes[selection.measure].forEach((note,i)=>{if(Math.floor(i/2)===beat)note.dots=value;});});}
function setNoteState(value){if(!selection||tab!=='note')return;const notes=selectedNotes(),clear=notes.every(n=>n.state===value);mutate(clear?'已恢复普通音符':value==='rest'?'已将整拍设为休止':value==='tie'?'已设为延音标记':'已设为弹奏标记',()=>{let indices=[...selection.indices];if(value==='rest'){let beats=new Set(indices.map(i=>Math.floor(i/2)));indices=model.notes[selection.measure].map((n,i)=>i).filter(i=>beats.has(Math.floor(i/2)));}indices.forEach(i=>model.notes[selection.measure][i].state=clear?'normal':value);});}
function locate(){if(!selection)return;let c=coords[selection.measure],scale=zoom/100,scroller=$('#canvas-scroll');scroller.scrollTo({left:Math.max(0,(c.x+100)*scale+34-scroller.clientWidth/2),top:Math.max(0,(c.y+55)*scale+30-scroller.clientHeight/2),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});notify('已定位第 '+(selection.measure+1)+' 小节');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(b&&(b.disabled||b.getAttribute('aria-disabled')==='true'))return;
 let target=e.target.closest('[data-note]');if(target){let m=+target.dataset.m,n=+target.dataset.note;if(e.shiftKey&&selection&&selection.measure===m){let indices=[...new Set([...selection.indices,n])].sort((a,b)=>a-b);setSelection({kind:new Set(indices.map(i=>Math.floor(i/2))).size>1?'multi':'note',measure:m,indices},'note');}else setSelection({kind:'note',measure:m,indices:[n]},'note');pending=null;return;}
 target=e.target.closest('[data-group]');if(target){const m=+target.dataset.group,g=model.tuplets[m];if(g){memberCount=g.members.length;condition='valid';pending=null;setSelection({kind:'tuplet',measure:m,indices:[...g.members]},'tuplet');}return;}
 target=e.target.closest('[data-measure]');if(target){pending=null;setSelection({kind:'measure',measure:+target.dataset.measure,indices:[0]},'measure');return;}
 if(!b){if(!e.target.closest('.zoom'))closeZoom();return;}
 if(b.dataset.duration){setDuration(b.dataset.duration);return;}if(b.dataset.dots!==undefined){setDots(+b.dataset.dots);return;}if(b.dataset.state){setNoteState(b.dataset.state);return;}
 if(b.dataset.tab){changeTab(b.dataset.tab);return;}if(b.dataset.review){selectReview(b.dataset.review);return;}
  if(b.dataset.ratio){pending=b.dataset.ratio;renderSidebar();$('#live').textContent='已选择'+tupletName(pending)+'，请应用';return;}
 if(b.dataset.bar!==undefined){let value=+b.dataset.bar;mutate('右边界已设为'+barNames[value],()=>model.bars[selection.measure]=value);return;}
 if(b.dataset.zoom){setZoom(+b.dataset.zoom);return;}
 if(b.dataset.action){let a=b.dataset.action;if(a.startsWith('tab-'))changeTab(a.replace('tab-',''));else if(a==='toolbar-dots')setDots((selectedNotes()[0]?.dots+1)%3);else if(a==='toolbar-rest')setNoteState('rest');return;}
 if(b.id==='undo'){undo();return;}if(b.id==='locate'){locate();return;}
 if(b.id==='apply-label'){const value=$('#section-label').value.trim();mutate('段落标记已应用',()=>model.labels[selection.measure]=value);return;}
  if(b.id==='apply-tuplet'&&pending&&!ratioReason(pending)){const ratio=pending;mutate(tupletName(ratio)+'已应用',()=>{model.tuplets[selection.measure]={ratio,members:[...selection.indices]};pending=null;});return;}
 if(b.id==='delete-tuplet'){mutate('已删除连音分组，保留全部音符',()=>{delete model.tuplets[selection.measure];pending=null;});return;}
 if(b.id==='zoom-minus'){setZoom([100,125,150,200][[100,125,150,200].indexOf(zoom)-1]);return;}if(b.id==='zoom-plus'){setZoom([100,125,150,200][[100,125,150,200].indexOf(zoom)+1]);return;}
 if(b.id==='zoom-toggle'){let hidden=$('#zoom-menu').hidden;$('#zoom-menu').hidden=!hidden;b.setAttribute('aria-expanded',String(hidden));if(hidden)$('#zoom-menu button[aria-checked=true]').focus();return;}
});
document.addEventListener('change',e=>{if(e.target.id==='measure-select'){pending=null;setSelection({kind:'measure',measure:+e.target.value,indices:[0]},'measure');}if(e.target.id==='review-members'){memberCount=+e.target.value;selection={kind:'tuplet',measure:selection?selection.measure:4,indices:Array.from({length:memberCount},(_,i)=>i)};tab='tuplet';revalidatePending();renderAll();}if(e.target.id==='review-condition'){condition=e.target.value;if(!selection||tab!=='tuplet'){selection={kind:'tuplet',measure:4,indices:Array.from({length:memberCount},(_,i)=>i)};tab='tuplet';}revalidatePending();renderAll();}});
document.addEventListener('input',e=>{if(e.target.id==='section-label'){const dirty=e.target.value.trim()!==model.labels[selection.measure];$('#apply-label').disabled=!dirty;$('#label-status').textContent=dirty?'待应用':'已应用到曲谱';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pending=null;selection=null;tab='note';closeZoom();hideTip();renderAll();$('#live').textContent='已取消选择';}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&e.target.tagName!=='INPUT'){e.preventDefault();undo();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-note],[data-measure],[data-group]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true,shiftKey:e.shiftKey}));}if(e.key==='Enter'&&e.target.id==='section-label'&&!$('#apply-label').disabled)$('#apply-label').click();if(e.target.closest('#zoom-menu')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();let btns=$$('#zoom-menu button'),index=btns.indexOf(e.target);btns[(index+(e.key==='ArrowDown'?1:3))%4].focus();}});
let activeTip=null;function showTip(el){if(!el||!el.dataset.tip)return;activeTip=el;let box=el.getBoundingClientRect(),tip=$('#tooltip');tip.textContent=el.dataset.tip;tip.classList.add('show');let r=tip.getBoundingClientRect();tip.style.left=Math.min(Math.max(8,box.left+box.width/2-r.width/2),innerWidth-r.width-8)+'px';tip.style.top=(box.top>r.height+14?box.top-r.height-8:box.bottom+8)+'px';el.setAttribute('aria-describedby','tooltip');}function hideTip(){if(activeTip)activeTip.removeAttribute('aria-describedby');activeTip=null;$('#tooltip').classList.remove('show');}
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(t);else hideTip();});document.addEventListener('pointerout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest?.('[data-tip]'))hideTip();});document.addEventListener('focusin',e=>showTip(e.target.closest('[data-tip]')));document.addEventListener('focusout',hideTip);document.addEventListener('click',hideTip);window.addEventListener('scroll',hideTip,true);
 $('[data-action="toolbar-rest"]').innerHTML=restSVG();
 renderAll();
})();
</script>
