when:
  - event: [push, manual]
    branch: openchamber/pindou

clone:
  git:
    image: docker.m.daocloud.io/library/python:3.12-slim
    environment:
      GITHUB_API_TOKEN:
        from_secret: github_api_checkout
    commands:
      - |
        python - <<'PY'
        import base64
        from concurrent.futures import ThreadPoolExecutor
        import hashlib
        import http.client
        import json
        import os
        from pathlib import Path, PurePosixPath
        import re
        import time
        import urllib.error
        import urllib.request

        if os.environ["CI_PIPELINE_EVENT"] == "manual":
            target = os.environ.get("BUILD_TARGET", "")
            if target not in ("", "all", "api", "web"):
                raise SystemExit("BUILD_TARGET must be api, web or all (empty defaults to all)")
            print("Manual build target:", target or "all", flush=True)

        repository = os.environ["CI_REPO"]
        commit = os.environ["CI_COMMIT_SHA"]
        if repository != "li-jingxuan/liuxianmao" or not re.fullmatch(r"[a-f0-9]{40}", commit):
            raise SystemExit("Unexpected repository or commit")
        root = Path.cwd().resolve()
        headers = {
            "Authorization": "Bearer " + os.environ["GITHUB_API_TOKEN"],
            "Accept": "application/vnd.github+json",
            "User-Agent": "Pindou-Woodpecker-checkout",
            "X-GitHub-Api-Version": "2022-11-28",
        }

        def request(path):
            for attempt in range(3):
                try:
                    url = "https://api.github.com/repos/" + repository + path
                    with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                        return json.load(response)
                except (OSError, ValueError, http.client.HTTPException):
                    if attempt == 2:
                        raise RuntimeError("GitHub API checkout failed") from None
                    time.sleep(attempt + 1)

        tree = request("/git/trees/" + commit + "?recursive=1")
        if tree.get("truncated"):
            raise SystemExit("Refusing incomplete repository tree")
        files = []
        for entry in tree["tree"]:
            path = PurePosixPath(entry["path"])
            if path.is_absolute() or ".." in path.parts or ".git" in path.parts:
                raise SystemExit("Unsafe repository path")
            if entry["type"] == "tree":
                continue
            if entry["type"] != "blob" or entry["mode"] not in ("100644", "100755"):
                raise SystemExit("Unsupported repository entry")
            files.append(entry)

        def checkout(entry):
            blob = request("/git/blobs/" + entry["sha"])
            content = base64.b64decode(blob["content"])
            header = b"blob " + str(len(content)).encode() + b"\0"
            if hashlib.sha1(header + content).hexdigest() != entry["sha"]:
                raise RuntimeError("Git blob checksum mismatch")
            path = root / entry["path"]
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(content)
            path.chmod(0o755 if entry["mode"] == "100755" else 0o644)

        with ThreadPoolExecutor(max_workers=4) as executor:
            list(executor.map(checkout, files))
        print("Verified checkout:", repository, commit, len(files), "files")
        PY

steps:
  - name: api-checks-and-tests
    image: docker.m.daocloud.io/library/python:3.12-slim
    when: &api_when
      - event: manual
        evaluate: 'BUILD_TARGET == "" || BUILD_TARGET in ["all", "api"]'
      - event: push
        path:
          include:
            - apps/pindou/apps/api/**
            - apps/pindou/deploy/api.Dockerfile
            - .woodpecker.yaml
            - apps/pindou/.dockerignore
            - apps/pindou/docker-compose.yml
            - apps/pindou/deploy/fnos/**
          on_empty: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      TEST_POSTGRES_URL: postgresql+psycopg://pindou:pindou-ci-only@postgres:5432/pindou_ci
    commands:
      - cd apps/pindou/apps/api
      - python -m pip install --no-cache-dir . pytest ruff
      - ruff check src tests
      - |
        python - <<'PY'
        import os
        import time
        from sqlalchemy import create_engine, text

        engine = create_engine(os.environ["TEST_POSTGRES_URL"])
        for attempt in range(30):
            try:
                with engine.connect() as connection:
                    connection.execute(text("SELECT 1"))
                break
            except Exception:
                if attempt == 29:
                    raise
                time.sleep(1)
        engine.dispose()
        PY
      - python -m pytest -q

  - name: web-checks-tests-and-build
    image: docker.m.daocloud.io/library/node:22-alpine
    when:
      - event: manual
        evaluate: 'BUILD_TARGET == "" || BUILD_TARGET in ["all", "web"]'
      - event: push
        path:
          include:
            - apps/pindou/apps/web/**
            - apps/pindou/deploy/web.Dockerfile
            - .woodpecker.yaml
            - apps/pindou/.dockerignore
            - apps/pindou/docker-compose.yml
            - apps/pindou/deploy/fnos/**
          on_empty: true
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_PUBLIC_BASE_PATH: /app/pindou
      NEXT_PUBLIC_API_BASE_URL: /app/pindou
    commands:
      - cd apps/pindou/apps/web
      - npm install --global pnpm@11.10.0 --registry=https://registry.npmmirror.com
      - pnpm install --frozen-lockfile
      - pnpm lint
      - pnpm test --maxWorkers=1
      - pnpm exec tsc --noEmit
      - pnpm exec next build --webpack
      - test -f .next/standalone/server.js

services:
  - name: postgres
    image: postgres:17-alpine
    when: *api_when
    environment:
      POSTGRES_DB: pindou_ci
      POSTGRES_USER: pindou
      POSTGRES_PASSWORD: pindou-ci-only
